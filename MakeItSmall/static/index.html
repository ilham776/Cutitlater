<!DOCTYPE html>
<!-- v2 -->
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- ═══ SEO ═══ -->
  <title>CutItNow — Cut & Download YouTube Clips Instantly</title>
  <meta name="description" content="CutItNow lets you cut any YouTube video into a clip and download it as MP4 or MP3. Set exact start and end times. Free, instant, no signup."/>
  <meta name="keywords" content="youtube clip downloader, cut youtube video, download youtube segment, youtube to mp3, youtube to mp4, trim youtube video"/>
  <meta name="robots" content="index, follow"/>
  <link rel="canonical" href="https://cutitnow.com/"/>
  <meta property="og:title" content="CutItNow — Cut & Download YouTube Clips"/>
  <meta property="og:description" content="Cut any YouTube video to exact seconds. Download as MP4 or MP3. Free and instant."/>
  <meta property="og:type" content="website"/>
  <meta property="og:url" content="https://cutitnow.com/"/>

  <!-- ═══ Fonts ═══ -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:      #E53935;
      --red-dark: #C62828;
      --bg:       #06080F;
      --card:     #0A0C15;
      --border:   #12151F;
      --border2:  #1A1D2E;
      --text:     #D0D4E8;
      --muted:    #3A3F5C;
      --mono:     'Space Mono', monospace;
      --display:  'Bebas Neue', sans-serif;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      min-height: 100vh;
      /* Prevent horizontal scroll on mobile */
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      text-align: center;
      padding: 40px 16px 28px;
      border-bottom: 1px solid var(--border);
      position: relative;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 50%; transform: translateX(-50%);
      width: 160px; height: 2px;
      background: var(--red);
    }

    .logo-row {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    /* Shrink logo on small screens */
    .logo-svg { flex-shrink: 0; }

    h1 {
      font-family: var(--display);
      font-size: clamp(2.4rem, 8vw, 3.8rem); /* scales with screen width */
      letter-spacing: 0.08em;
      color: #fff;
      line-height: 1;
    }
    h1 span { color: var(--red); }

    .tagline {
      font-size: clamp(0.52rem, 2vw, 0.62rem);
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 6px;
      padding: 0 8px;
    }

    /* ── Layout ── */
    main {
      max-width: 680px;
      margin: 24px auto;
      padding: 0 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: clamp(16px, 4vw, 28px); /* less padding on small screens */
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 18px 0;
    }

    /* ── Labels ── */
    .label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--red);
      font-weight: 700;
      display: block;
      margin-bottom: 10px;
    }

    /* ── URL input ── */
    #url-input {
      width: 100%;
      background: #080A12;
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--mono);
      font-size: clamp(0.72rem, 2.5vw, 0.82rem);
      padding: 13px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      /* Prevent zoom on focus in iOS */
      font-size: max(16px, 0.82rem);
    }
    #url-input:focus {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(229,57,53,0.1);
    }
    #url-input::placeholder { color: #1E2235; }

    /* ── Video preview ── */
    #video-preview {
      display: none;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
      background: #080A12;
      border: 1px solid var(--border2);
      border-radius: 8px;
      padding: 10px;
    }
    #video-preview img {
      width: 80px;
      height: 45px;
      object-fit: cover;
      border-radius: 4px;
      flex-shrink: 0;
    }
    #video-title {
      font-size: clamp(0.68rem, 2.2vw, 0.78rem);
      color: var(--text);
      line-height: 1.4;
      /* Truncate long titles on mobile */
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    #video-duration {
      font-size: 0.62rem;
      color: var(--muted);
      margin-top: 3px;
    }

    /* ── Format toggle ── */
    .format-row {
      display: flex;
      gap: 10px;
    }
    .fmt-btn {
      flex: 1; /* each button takes equal width on mobile */
      background: #080A12;
      border: 1px solid var(--border2);
      border-radius: 7px;
      padding: 11px 10px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: clamp(0.65rem, 2.2vw, 0.75rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .fmt-btn.active {
      background: rgba(229,57,53,0.1);
      border-color: var(--red);
      color: var(--red);
    }

    /* ── Time pickers ── */
    .time-row {
      display: flex;
      align-items: flex-end;
      gap: 6px;
    }
    .time-group {
      display: flex;
      gap: 5px;
      flex: 1;
    }
    .time-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .time-field span {
      font-size: clamp(0.5rem, 1.8vw, 0.58rem);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 700;
      text-align: center;
    }
    .time-field input {
      width: 100%;
      background: #080A12;
      border: 1px solid var(--border2);
      border-radius: 8px;
      color: #fff;
      font-family: var(--display);
      /* Scales down nicely on small screens */
      font-size: clamp(1.2rem, 5vw, 1.7rem);
      letter-spacing: 0.04em;
      text-align: center;
      padding: clamp(6px, 2vw, 10px) 2px;
      outline: none;
      transition: border-color 0.2s;
      -moz-appearance: textfield;
      /* Prevent iOS zoom */
      font-size: max(16px, clamp(1.1rem, 4vw, 1.7rem));
    }
    .time-field input::-webkit-outer-spin-button,
    .time-field input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .time-field input:focus { border-color: var(--red); }

    .time-arrow {
      color: var(--border2);
      font-size: clamp(0.9rem, 3vw, 1.2rem);
      padding-bottom: 12px;
      flex-shrink: 0;
    }

    /* ── CTA button ── */
    #cut-btn {
      width: 100%;
      margin-top: 6px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: clamp(13px, 3vw, 16px);
      font-family: var(--display);
      font-size: clamp(1rem, 4vw, 1.2rem);
      letter-spacing: 0.15em;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(229,57,53,0.25);
      transition: all 0.2s;
      /* Makes it easy to tap on mobile */
      min-height: 52px;
      touch-action: manipulation;
    }
    #cut-btn:hover:not(:disabled) {
      background: #EF5350;
      box-shadow: 0 6px 28px rgba(229,57,53,0.45);
      transform: translateY(-1px);
    }
    #cut-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* ── Status ── */
    #status {
      display: none;
      margin-top: 14px;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: clamp(0.68rem, 2.2vw, 0.75rem);
      letter-spacing: 0.04em;
      line-height: 1.5;
    }
    #status.loading {
      display: block;
      background: rgba(229,57,53,0.08);
      border: 1px solid rgba(229,57,53,0.2);
      color: var(--red);
    }
    #status.success {
      display: block;
      background: rgba(76,175,80,0.08);
      border: 1px solid rgba(76,175,80,0.2);
      color: #4CAF50;
    }
    #status.error {
      display: block;
      background: rgba(229,57,53,0.08);
      border: 1px solid rgba(229,57,53,0.3);
      color: #FF6B6B;
    }

    /* ── Download button ── */
    #download-btn {
      display: none;
      width: 100%;
      margin-top: 10px;
      background: #071A0E;
      border: 1px solid #145222;
      color: #4CAF50;
      border-radius: 8px;
      padding: 14px;
      font-family: var(--mono);
      font-size: clamp(0.68rem, 2.2vw, 0.78rem);
      letter-spacing: 0.06em;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      min-height: 48px;
      line-height: 1.4;
      touch-action: manipulation;
    }

    /* ── Ad slots ── */
    .ad-slot {
      margin: 16px 0;
      background: var(--card);
      border: 1px dashed var(--border2);
      border-radius: 8px;
      /* Responsive height */
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 20px 16px;
      color: #171A26;
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    /* ════════════════════════════════
       MOBILE BREAKPOINTS
       ════════════════════════════════ */

    /* Tablet and below */
    @media (max-width: 600px) {
      header { padding: 28px 12px 22px; }

      .logo-row { gap: 10px; }

      /* Shrink the scissors logo */
      .logo-svg { width: 40px; height: 40px; }

      /* Stack time pickers vertically on very small screens */
      .time-row { flex-direction: column; gap: 10px; }
      .time-group { width: 100%; }
      .time-arrow {
        padding-bottom: 0;
        text-align: center;
        font-size: 1rem;
        transform: rotate(90deg); /* arrow points down on mobile */
        display: block;
        width: 100%;
      }

      main { margin: 16px auto; padding: 0 10px; }
    }

    /* Very small phones (iPhone SE etc) */
    @media (max-width: 380px) {
      h1 { font-size: 2rem; }
      .tagline { font-size: 0.48rem; letter-spacing: 0.12em; }
      .card { border-radius: 10px; }
    }
  </style>
</head>

<body>

  <!-- ═══ HEADER ═══ -->
  <header>
    <div class="logo-row">
      <svg class="logo-svg" width="52" height="52" viewBox="0 0 58 58" fill="none">
        <circle cx="29" cy="29" r="4.5" fill="#E53935"/>
        <path d="M29 29 L8 10"  stroke="#E53935" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M29 29 L14 6"  stroke="#E53935" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M8 10 L14 6"   stroke="#E53935" stroke-width="2"   stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M29 29 L50 48" stroke="#C62828" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M29 29 L44 52" stroke="#C62828" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M50 48 L44 52" stroke="#C62828" stroke-width="2"   stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="7"  cy="12" r="6"   stroke="#E53935" stroke-width="2.5" fill="none"/>
        <circle cx="51" cy="46" r="6"   stroke="#C62828" stroke-width="2.5" fill="none"/>
        <circle cx="7"  cy="12" r="2.5" fill="#E53935" opacity="0.35"/>
        <circle cx="51" cy="46" r="2.5" fill="#C62828" opacity="0.35"/>
      </svg>
      <h1>Cut<span>It</span>Now</h1>
    </div>
    <p class="tagline">Precision clip extraction — any moment, any format</p>
  </header>

  <!-- ═══ AD SLOT TOP ═══ -->
  <div style="max-width:680px; margin:0 auto; padding:0 12px;">
    <div class="ad-slot">Ad — Google AdSense goes here</div>
  </div>

  <!-- ═══ MAIN CARD ═══ -->
  <main>
    <div class="card">

      <!-- URL -->
      <span class="label">🔗 YouTube URL</span>
      <input type="url" id="url-input" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" autocorrect="off" spellcheck="false"/>

      <!-- Preview -->
      <div id="video-preview">
        <img id="thumb" src="" alt="thumbnail"/>
        <div>
          <div id="video-title">—</div>
          <div id="video-duration">—</div>
        </div>
      </div>

      <hr class="divider"/>

      <!-- Format -->
      <span class="label">Output Format</span>
      <div class="format-row">
        <button class="fmt-btn active" data-fmt="mp4">MP4 — Video</button>
        <button class="fmt-btn"        data-fmt="mp3">MP3 — Audio</button>
      </div>

      <hr class="divider"/>

      <!-- Time pickers -->
      <span class="label">⏱ Clip Range</span>
      <div class="time-row">

        <div class="time-group">
          <div class="time-field"><span>HH</span><input type="number" id="sh" min="0" max="23" value="0"/></div>
          <div class="time-field"><span>MM</span><input type="number" id="sm" min="0" max="59" value="0"/></div>
          <div class="time-field"><span>SS</span><input type="number" id="ss" min="0" max="59" value="15"/></div>
        </div>

        <div class="time-arrow">→</div>

        <div class="time-group">
          <div class="time-field"><span>HH</span><input type="number" id="eh" min="0" max="23" value="0"/></div>
          <div class="time-field"><span>MM</span><input type="number" id="em" min="0" max="59" value="0"/></div>
          <div class="time-field"><span>SS</span><input type="number" id="es" min="0" max="59" value="45"/></div>
        </div>

      </div>

      <hr class="divider"/>

      <button id="cut-btn">CUT &amp; DOWNLOAD</button>
      <div id="status"></div>
      <a id="download-btn" download>💾 Save Clip to Device</a>

    </div>

    <!-- ═══ AD SLOT BOTTOM ═══ -->
    <div class="ad-slot">Ad — Google AdSense goes here</div>

  </main>

  <footer>CutItNow — Made for editors &nbsp;|&nbsp; 
  <a href="/static/privacy.html" target="_blank" style="color:#3A3F5C; text-decoration:none;">Privacy Policy</a> 
  &nbsp;|&nbsp; 
  <a href="/static/terms.html" target="_blank" style="color:#3A3F5C; text-decoration:none;">Terms of Service</a>
</footer>

  <script>
    const API = "https://cutitnow.com";
    let selectedFormat = "mp4";

    // Format toggle
    document.querySelectorAll(".fmt-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".fmt-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedFormat = btn.dataset.fmt;
      });
    });

    // Auto-fetch video info on URL paste
    let infoTimer = null;
    document.getElementById("url-input").addEventListener("input", e => {
      clearTimeout(infoTimer);
      const url = e.target.value.trim();
      if (!url.includes("youtube.com") && !url.includes("youtu.be")) return;
      infoTimer = setTimeout(() => fetchInfo(url), 800);
    });

    async function fetchInfo(url) {
      try {
        const res  = await fetch(`${API}/info?url=${encodeURIComponent(url)}`);
        const data = await res.json();
        if (!res.ok) return;
        document.getElementById("thumb").src = data.thumbnail;
        document.getElementById("video-title").textContent = data.title;
        document.getElementById("video-duration").textContent = formatDuration(data.duration);
        document.getElementById("video-preview").style.display = "flex";
      } catch (_) {}
    }

    function formatDuration(s) {
      const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
      return h > 0 ? `${pad(h)}:${pad(m)}:${pad(sec)}` : `${pad(m)}:${pad(sec)}`;
    }
    function pad(n) { return String(n).padStart(2, "0"); }
    function buildTime(h, m, s) {
      return `${pad(document.getElementById(h).value||0)}:${pad(document.getElementById(m).value||0)}:${pad(document.getElementById(s).value||0)}`;
    }
    function setStatus(type, msg) {
      const el = document.getElementById("status");
      el.className = type; el.textContent = msg;
    }

    // Main action
    document.getElementById("cut-btn").addEventListener("click", async () => {
      const url = document.getElementById("url-input").value.trim();
      if (!url) { setStatus("error", "Paste a YouTube URL first."); return; }

      const start = buildTime("sh","sm","ss");
      const end   = buildTime("eh","em","es");

      document.getElementById("cut-btn").disabled = true;
      document.getElementById("download-btn").style.display = "none";
      setStatus("loading", "⏳ Fetching stream and cutting clip — this takes 10–30 seconds...");

      try {
        const res = await fetch(`${API}/clip`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url, start, end, format: selectedFormat }),
        });

        if (!res.ok) { const e = await res.json(); throw new Error(e.detail || "Unknown error"); }

        const blob    = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const dlBtn   = document.getElementById("download-btn");
        dlBtn.href     = blobUrl;
        dlBtn.download = `cutitnow_clip.${selectedFormat}`;
        dlBtn.style.display = "block";
        setStatus("success", `✅ Done! Clip ready — ${start} → ${end}`);

      } catch (err) {
        setStatus("error", `Error: ${err.message}`);
      } finally {
        document.getElementById("cut-btn").disabled = false;
      }
    });
  </script>

</body>
</html>
